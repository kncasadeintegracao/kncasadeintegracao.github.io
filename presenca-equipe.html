<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1F5558">
<title>Presença da equipe · KN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--verde:#1F5558;--verde-claro:#518E91;--verde-bg:#EEF4F3;--dourado:#C9A55A;--marrom:#4E2D0C;--texto:#22333A;--suave:#5E6E72;--branco:#fff;
--display:"Cormorant Garamond",Georgia,serif;--body:"Montserrat","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--verde-bg);color:var(--texto);min-height:100vh;-webkit-font-smoothing:antialiased}
header{background:var(--verde);border-bottom:3px solid var(--dourado);padding:22px 16px 18px;text-align:center}
header img{height:64px;width:auto}
header p{color:#DDE9E8;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;margin-top:8px}
main{max-width:440px;margin:0 auto;padding:22px 16px 40px}
h1{font-family:var(--display);font-weight:600;font-size:1.9rem;color:var(--verde);text-align:center;line-height:1.1}
.sub{text-align:center;color:var(--suave);font-size:.9rem;margin:8px 0 20px}
.relogio{background:var(--branco);border-radius:16px;padding:16px;text-align:center;box-shadow:0 4px 18px rgba(31,85,88,.10);margin-bottom:18px}
.relogio .h{font-family:var(--display);font-size:2.6rem;font-weight:600;color:var(--verde);line-height:1}
.relogio .d{font-size:.85rem;color:var(--suave);margin-top:4px}
label{display:block;font-size:.8rem;font-weight:600;color:var(--verde);margin:0 0 6px 4px}
input{width:100%;font:inherit;font-size:1rem;padding:13px 14px;border:1.5px solid #C9DAD8;border-radius:12px;background:var(--branco);color:var(--texto);margin-bottom:18px}
input:focus{outline:none;border-color:var(--verde-claro)}
.botoes{display:grid;gap:12px}
button{font:inherit;font-weight:600;font-size:1.1rem;border:0;border-radius:14px;padding:18px 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .08s,opacity .2s}
button:active{transform:scale(.98)}
button:disabled{opacity:.5;cursor:default}
.entrada{background:linear-gradient(135deg,#2C6E71,var(--verde));color:var(--branco);box-shadow:0 6px 16px rgba(31,85,88,.28)}
.saida{background:var(--branco);color:var(--verde);border:2px solid var(--verde)}
.sugerido{outline:3px solid var(--dourado);outline-offset:2px}
.aviso{display:none;margin-top:18px;background:var(--branco);border-left:4px solid var(--dourado);border-radius:12px;padding:14px 16px;font-size:.92rem;line-height:1.45;box-shadow:0 4px 14px rgba(31,85,88,.08)}
.aviso b{color:var(--verde)}
.aviso a{display:block;margin-top:10px;text-align:center;background:#25D366;color:#fff;text-decoration:none;font-weight:600;padding:11px;border-radius:10px}
.aviso.erro{border-left-color:#B5483B}
.hist{margin-top:24px}
.hist h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--suave);margin-bottom:8px}
.hist ul{list-style:none;background:var(--branco);border-radius:12px;overflow:hidden}
.hist li{display:flex;justify-content:space-between;padding:10px 14px;font-size:.88rem;border-bottom:1px solid #E5EEED}
.hist li:last-child{border-bottom:0}
.hist .tipo-e{color:var(--verde);font-weight:600}
.hist .tipo-s{color:var(--marrom);font-weight:600}
footer{text-align:center;font-size:.72rem;color:var(--suave);padding:0 16px 28px;line-height:1.6}
</style>
</head>

<main>
  <h1>Registro de presença</h1>
  <p class="sub">Toque ao chegar e ao sair da clínica.</p>

  <div class="relogio"><div class="h" id="hora">--:--</div><div class="d" id="data"></div></div>

  <label for="nome">Seu nome</label>
  <input id="nome" autocomplete="name" placeholder="Digite seu nome (só na primeira vez)">

  <div class="botoes">
    <button class="entrada" id="bE" onclick="registrar('ENTRADA')">☀️ Cheguei</button>
    <button class="saida" id="bS" onclick="registrar('SAÍDA')">🌙 Estou saindo</button>
  </div>

  <div class="aviso" id="aviso"></div>

  <div class="hist" id="histBox" style="display:none">
    <h2>Seus últimos registros neste celular</h2>
    <ul id="hist"></ul>
  </div>
</main>
<footer>KN Casa de Integração® · Rua Etiópia, 81 · Mooca/SP<br>© 2026 KN Casa de Integração®. Todos os direitos reservados.</footer>

<script>
var KIKA='5511912016881', EMAIL='320ac6002af4941d9ed45973e1738f38', CHAVE='kn_presenca';
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var nome=document.getElementById('nome'); nome.value=ls(CHAVE+'_nome')||'';
function fmt(d){return {data:d.toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'}),hora:d.toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'}),dia:d.toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo',weekday:'long',day:'numeric',month:'long'})}}
function tick(){var f=fmt(new Date());document.getElementById('hora').textContent=f.hora;document.getElementById('data').textContent=f.dia.charAt(0).toUpperCase()+f.dia.slice(1)}
tick();setInterval(tick,15000);
function historico(){try{return JSON.parse(ls(CHAVE+'_hist')||'[]')}catch(e){return []}}
function desenhar(){var h=historico(),ul=document.getElementById('hist');ul.innerHTML='';
  h.slice(0,8).forEach(function(r){var li=document.createElement('li');li.innerHTML='<span class="'+(r.t==='ENTRADA'?'tipo-e':'tipo-s')+'">'+(r.t==='ENTRADA'?'Entrada':'Saída')+'</span><span>'+r.d+' · '+r.h+'</span>';ul.appendChild(li)});
  document.getElementById('histBox').style.display=h.length?'block':'none';
  var hoje=fmt(new Date()).data, ult=h[0];
  var proxSaida=ult&&ult.d===hoje&&ult.t==='ENTRADA';
  document.getElementById('bE').classList.toggle('sugerido',!proxSaida);
  document.getElementById('bS').classList.toggle('sugerido',!!proxSaida);
}
desenhar();
function aviso(html,erro){var a=document.getElementById('aviso');a.innerHTML=html;a.className='aviso'+(erro?' erro':'');a.style.display='block';a.scrollIntoView({behavior:'smooth',block:'nearest'})}
function registrar(tipo){
  var n=nome.value.trim();
  if(n.length<2){aviso('Digite o seu nome antes de registrar, por favor.',true);nome.focus();return}
  ls(CHAVE+'_nome',n);
  var agora=new Date(), f=fmt(agora);
  var bE=document.getElementById('bE'),bS=document.getElementById('bS');bE.disabled=bS.disabled=true;
  var texto='Registro de presença – '+n+' – '+tipo+' – '+f.data+' às '+f.hora;
  fetch('https://formsubmit.co/ajax/'+EMAIL,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({_subject:'Presença – '+n+' – '+tipo+' – '+f.data+' '+f.hora,_template:'table',_captcha:'false',
      Registro:tipo,Nome:n,Data:f.data,'Horário (celular)':f.hora,'Dia':f.dia,Origem:'Página de presença da equipe (QR Code da recepção)'})})
  .then(function(r){return r.json()})
  .then(function(j){
    if(j&&(j.success===true||j.success==='true')){
      var h=historico();h.unshift({t:tipo,d:f.data,h:f.hora});ls(CHAVE+'_hist',JSON.stringify(h.slice(0,30)));desenhar();
      aviso('<b>'+(tipo==='ENTRADA'?'Bom trabalho, ':'Até a próxima, ')+n.split(' ')[0]+'!</b><br>'+(tipo==='ENTRADA'?'Entrada':'Saída')+' registrada em '+f.data+' às '+f.hora+'. ✓'+
        '<a href="https://wa.me/'+KIKA+'?text='+encodeURIComponent(texto)+'" target="_blank" rel="noopener">Enviar também para o WhatsApp da Kika</a>');
    } else { throw new Error('falha') }
  })
  .catch(function(){aviso('Não consegui registrar agora. Confira a internet e tente de novo. Se não der, envie pelo WhatsApp:'+
    '<a href="https://wa.me/'+KIKA+'?text='+encodeURIComponent(texto)+'" target="_blank" rel="noopener">Registrar pelo WhatsApp da Kika</a>',true)})
  .finally(function(){bE.disabled=bS.disabled=false});
}
</script>
