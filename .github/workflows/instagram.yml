name: Publicar no Instagram da KN
on:
  push:
    branches: [main]
    paths: ["posts/**/post.json", "posts/teste.txt", "tools/publish_ig.py"]
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar ou teste"
        default: "publicar"
permissions:
  contents: write
concurrency: instagram
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar posts aprovados
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841473570396419"
        run: python3 tools/publish_ig.py ${{ github.event.inputs.modo == 'teste' && 'teste' || '' }}
      - name: Salvar links dos posts publicados
        run: |
          git config user.name "KN Casa de Integração"
          git config user.email "kncasadeintegracao@gmail.com"
          git add posts
          git diff --cached --quiet || (git commit -m "Instagram: links dos posts publicados [skip ci]" && git push)
